name: Build Castor Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk castor-android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: castor-android-debug-apk
          path: castor-android-debug.apk
          if-no-files-found: error
          retention-days: 14
